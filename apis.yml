name: Sahi
description: >-
  Sahi is a high-performance Indian stock trading platform built for active retail
  traders, operated by Aaritya Broking Private Limited (SEBI INZ000317632) and based
  in Bangalore. Founded by Dale Vaz (former Swiggy CTO) and Manish Jain (former Kotak
  Securities executive), Sahi offers futures & options trading, equity/stock trading,
  IPO applications, and ETF investing at a flat brokerage of Rs.10 per executed order.
  The mobile-native platform emphasizes millisecond order-execution latency, an in-house
  charting tool (Sahi Charts), real-time stock scanners, AI-backed market intelligence,
  and SEBI-registered research. Sahi is an Accel portfolio company. It does not currently
  publish a public developer API, but it does publish a machine-readable /llms.txt.
